<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#a3473a">
<title>교실 운동회</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
:root{--ink:#2b2d3c;--red:#a3473a;--redD:#7a3329;--wood:#a8743f;--woodD:#7a5128;--paper:#faf3e3;--paper2:#f1e6cc;--board:#2f4a3e;--blue:#3469c0;--blueD:#24467f;--white:#f6f2e8;--yellow:#f3d468;--ground:#ddd0b6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#efe3c8;color:var(--ink);font-family:Galmuri11,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden;word-break:keep-all;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
.hidden{display:none!important}
.btn{background:var(--wood);color:#fff7e6;border:4px solid var(--ink);box-shadow:inset 0 -6px 0 var(--woodD),0 4px 0 var(--ink);font-weight:700;text-shadow:2px 2px 0 rgba(60,35,10,.6);padding:10px 18px;font-size:22px;border-radius:0;transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -3px 0 var(--woodD),0 1px 0 var(--ink)}
.btn.red{background:var(--red);box-shadow:inset 0 -6px 0 var(--redD),0 4px 0 var(--ink)}
.btn.blue{background:var(--blue);box-shadow:inset 0 -6px 0 var(--blueD),0 4px 0 var(--ink)}
.btn.light{background:var(--white);color:var(--ink);text-shadow:none;box-shadow:inset 0 -6px 0 #c7c0b0,0 4px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.paper{background:var(--paper);border:4px solid var(--ink);box-shadow:0 6px 0 rgba(43,45,60,.35)}
.chalk{background:var(--board);border:8px solid #8a5a2b;box-shadow:0 0 0 4px var(--ink),0 8px 0 4px rgba(0,0,0,.3);color:#f3ecd9}
.bunting{height:26px;background:repeating-linear-gradient(90deg,transparent 0 2px,transparent 2px 40px);position:relative}
.bunting::before{content:"";position:absolute;inset:0;background:
 conic-gradient(from 135deg at 50% 0,#e74c3c 0 90deg,transparent 0) 0 0/40px 26px repeat-x;}
.bunting.multi::before{background:
 linear-gradient(135deg,transparent 50%,transparent 0),
 conic-gradient(from 135deg at 10px 0,#e74c3c 0 90deg,transparent 0) 0 0/100px 22px repeat-x,
 conic-gradient(from 135deg at 30px 0,#3498db 0 90deg,transparent 0) 0 0/100px 22px repeat-x,
 conic-gradient(from 135deg at 50px 0,#f1c40f 0 90deg,transparent 0) 0 0/100px 22px repeat-x,
 conic-gradient(from 135deg at 70px 0,#2ecc71 0 90deg,transparent 0) 0 0/100px 22px repeat-x,
 conic-gradient(from 135deg at 90px 0,#ecf0f1 0 90deg,transparent 0) 0 0/100px 22px repeat-x}
.titlebar{background:var(--red);color:#fff3dc;border-bottom:4px solid var(--ink);display:flex;align-items:center;gap:18px;padding:0 24px;text-shadow:3px 3px 0 var(--redD)}
.titlebar b{font-size:38px}
.titlebar span{font-size:22px;opacity:.95}
.modal-bg{position:fixed;inset:0;background:rgba(30,30,40,.55);display:flex;align-items:center;justify-content:center;z-index:50}

/* ---------- 학생(태블릿) ---------- */
#student{position:fixed;inset:0}
.sscreen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;overflow:auto;background:#efe3c8}
.sscreen .bunting{width:100%;flex:0 0 auto}
.logo{font-size:min(11vw,64px);font-weight:700;color:var(--red);text-shadow:4px 4px 0 #e2c7a0;margin:3vh 0 0}
.sub{font-size:min(4.4vw,22px);margin:6px 0 3vh;text-align:center;padding:0 16px}
.codebox{display:flex;gap:min(2vw,12px);margin-bottom:2.5vh}
.codebox div{width:min(14vw,82px);height:min(18vw,100px);background:#fff;border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:min(11vw,60px);font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.keypad{display:grid;grid-template-columns:repeat(3,min(24vw,124px));gap:min(2.2vw,12px)}
.keypad .btn{font-size:min(7vw,36px);padding:min(2.4vw,14px) 0}
.join{margin-top:2.5vh;width:min(80vw,396px);font-size:min(7vw,34px)!important;padding:14px!important}
.tlink{margin:3vh 0 4vh;font-size:16px;color:#6b5a44;text-decoration:underline;background:none;border:none}
.namewrap{display:flex;gap:4vw;align-items:flex-start;justify-content:center;width:100%;padding:3vh 4vw;flex-wrap:wrap}
.namecol{flex:1 1 360px;max-width:520px}
.namecol h2{font-size:min(9vw,52px);color:var(--red);margin:0 0 8px;text-shadow:3px 3px 0 #e2c7a0}
.namecol p{font-size:min(4.2vw,20px);line-height:1.5;margin:0 0 16px}
.namerow{display:flex;gap:12px}
.namerow input{flex:1;min-width:0;font-size:min(8vw,40px);padding:12px 14px;border:4px solid var(--ink);background:#fff;outline:none}
.namerow .btn{font-size:min(5.5vw,28px)}
.prevbox{flex:0 1 380px;min-width:260px}
.prevbox .hd{background:var(--red);color:#fff3dc;font-size:22px;text-align:center;padding:10px;border:4px solid var(--ink);border-bottom:none}
.prevbox canvas{width:100%;display:block;border:4px solid var(--ink);background:var(--paper);image-rendering:pixelated}
.notice{font-size:min(4.4vw,22px);text-align:center;line-height:1.6;padding:20px;max-width:640px}
.notice b{font-size:min(7vw,38px);display:block;margin-bottom:12px;color:var(--red)}
#play{position:absolute;inset:0;background:#2b2d3c}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
#play .frame{position:absolute;inset:0;border:8px solid var(--blue);pointer-events:none}
#play.t1 .frame{border-color:#d9d3c3}
.hudTop{position:absolute;left:14px;top:14px;right:calc(min(22vw,190px) + 30px);display:flex;align-items:flex-start;gap:10px;z-index:3;flex-wrap:wrap}
.hudL{display:flex;align-items:center;gap:10px;background:var(--paper);border:4px solid var(--ink);padding:6px 8px;font-size:min(2.6vw,22px);font-weight:700;z-index:3}
.hudL .tb{background:var(--blue);color:#fff;padding:4px 8px}
#play.t1 .hudL .tb{background:#d9d3c3;color:var(--ink)}
.hudL .btn{font-size:min(3.2vw,18px);padding:4px 10px}
.score{margin:0 auto;display:flex;align-items:stretch;background:var(--wood);border:4px solid var(--ink);font-weight:700;z-index:3}
.score .t{padding:2px 10px;font-size:min(4vw,24px);color:#fff7e6;text-shadow:2px 2px 0 var(--woodD);display:flex;align-items:center}
.score .n{background:var(--blue);color:#fff;min-width:44px;text-align:center;font-size:min(5vw,30px);padding:0 6px;display:flex;align-items:center;justify-content:center}
.score .n.w{background:#efeae0;color:var(--ink)}
.score .tm{background:var(--board);color:var(--yellow);font-size:min(5vw,30px);padding:0 12px;display:flex;align-items:center}
#mini{position:absolute;right:14px;top:14px;width:min(22vw,190px);border:4px solid #8a5a2b;outline:3px solid var(--ink);background:var(--board);z-index:3}
.banner{position:absolute;left:50%;top:min(15vh,110px);transform:translateX(-50%);z-index:4;text-align:center;pointer-events:none}
.banner .b1{display:inline-block;background:var(--paper);border:4px solid var(--ink);padding:6px 18px;font-size:min(6vw,36px);font-weight:700;color:var(--red);white-space:nowrap}
.banner .b2{display:inline-block;margin-top:6px;background:var(--ink);color:#fff;padding:4px 12px;font-size:min(3.6vw,20px)}
.banner.blue .b1{color:var(--blue)}
#joy{position:absolute;left:3vw;bottom:3vw;width:min(34vw,230px);height:min(34vw,230px);border-radius:50%;background:rgba(80,80,90,.35);border:4px solid rgba(43,45,60,.5);z-index:3;touch-action:none}
#joy .k{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:rgba(245,240,228,.85);border:4px solid var(--ink)}
#bigBtn{position:absolute;right:3vw;bottom:3vw;width:min(30vw,220px);height:min(24vw,170px);font-size:min(8vw,52px);z-index:3;touch-action:none}
#bigBtn .ring{position:absolute;inset:-14px;border:6px solid var(--yellow);pointer-events:none;opacity:0}
.toast{position:absolute;left:50%;bottom:4vh;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;font-size:min(4.4vw,24px);z-index:6;border:3px solid #fff;white-space:nowrap}
.toast.top{bottom:auto;top:min(26vh,190px)}
.ovl{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;overflow:auto}
.ovl.dim{background:rgba(43,45,60,.82);color:#fff}
.ovl.paperbg{background:#efe3c8}
.cheerOv{background:var(--blue);color:#fff;flex-direction:row;gap:5vw}
.cheerOv.t1{background:#ece6d8;color:var(--ink)}
.cheerOv.off{background:#3a3d50;color:#ddd}
.cheerOv h1{font-size:min(12vw,96px);margin:0;text-shadow:5px 5px 0 rgba(0,0,0,.25)}
.cheerOv p{font-size:min(5vw,34px);margin:10px 0}
.drumpad{width:min(42vw,360px);height:min(42vw,360px);background:var(--paper);border:6px solid var(--ink);display:flex;align-items:center;justify-content:center;touch-action:none;cursor:pointer}
.drumpad canvas{width:80%;image-rendering:pixelated;pointer-events:none}
.meter{display:flex;gap:3px;background:var(--ink);padding:6px;margin-top:10px;align-items:center}
.meter i{width:min(1.6vw,12px);height:min(4vw,26px);background:#e2d3ad;display:block}
.meter i.on{background:var(--blue)}
.cheerOv.t1 .meter i.on{background:#fff}
.meter span{color:#fff;font-size:18px;margin-right:8px}
.rcard{background:var(--paper);color:var(--ink);border:4px solid var(--ink);padding:18px 22px;max-width:640px;width:92%;margin:8px auto;text-align:left}
.rcard h3{margin:0 0 8px;color:var(--red);font-size:min(6vw,30px)}
.rcard .ln{font-size:min(4.6vw,24px);margin:6px 0}
.cardbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.cardbtns .btn{font-size:min(4.2vw,22px)}
.bigscore{font-size:min(14vw,90px);font-weight:700}
.bigscore .b{color:var(--blue)}

/* ---------- TV ---------- */
#tv{position:fixed;inset:0;background:#1e1f2a;display:flex;align-items:center;justify-content:center}
#tvStage{width:1600px;height:900px;position:relative;flex:0 0 auto;transform-origin:center center;overflow:hidden;background:var(--ground)}
#tvc{position:absolute;inset:0;width:1600px;height:900px;image-rendering:pixelated}
#tvO{position:absolute;inset:0}
.tvtop{position:absolute;left:0;right:0;top:0;height:62px;background:var(--wood);border-bottom:4px solid var(--ink);display:flex;align-items:stretch;z-index:5;box-shadow:inset 0 -5px 0 var(--woodD)}
.tvtop .pz{width:150px;font-size:20px;padding:0;margin:4px;box-shadow:none}
.tvtop .rm{background:var(--ink);color:var(--yellow);margin:4px;padding:2px 10px;font-size:30px;font-weight:700;display:flex;flex-direction:column;justify-content:center;line-height:1}
.tvtop .rm small{font-size:11px;color:#ddd;text-align:center}
.tvtop .tn{font-size:36px;font-weight:700;color:#fff;display:flex;align-items:center;padding:0 14px;margin:4px 0}
.tvtop .tn.b{background:var(--blue)}
.tvtop .tn.w{background:#efeae0;color:var(--ink)}
.tvtop .dg{display:flex;gap:4px;margin:4px 6px}
.tvtop .dg i{font-style:normal;background:var(--blue);color:#fff;font-size:44px;font-weight:700;width:40px;display:flex;align-items:center;justify-content:center;border-bottom:4px solid var(--blueD)}
.tvtop .dg.w i{background:#efeae0;color:var(--ink);border-bottom-color:#c7c0b0}
.tvtop .mid{background:var(--board);color:#f3ecd9;display:flex;align-items:center;gap:16px;padding:0 18px;margin:0 6px;flex:0 0 380px;justify-content:center}
.tvtop .mid .lb{font-size:18px;line-height:1.15;text-align:center;max-width:130px;word-break:keep-all}
.tvtop .mid .clk{font-size:52px;color:var(--yellow);font-weight:700}
.tvtop .mid .clk.red{color:#ff6b5a}
.tvtop .mid .inf{font-size:17px;line-height:1.3;text-align:left}
.tvtop .warn{margin-left:auto;display:flex;flex-direction:column;justify-content:center;font-size:16px;color:#fff7e6;padding-right:14px;text-align:right}
.tvpanel{position:absolute}
.roster{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;margin-top:6px}
.roster h4{margin:0;font-size:30px;border-bottom:3px solid;padding-bottom:4px;margin-bottom:4px}
.roster h4.b{color:#8fb5ea;border-color:#8fb5ea}
.roster h4.w{color:#fff;border-color:#fff}
.roster button{display:block;background:none;border:none;color:#f3ecd9;font-size:27px;padding:1px 0;text-align:left;width:100%}
.roster button::before{content:"▪ ";color:#9fb0a6}
.roster button.off{opacity:.4}
.roster button.ai{color:#9fd0e0}
.roster button:hover{color:var(--yellow)}
.codeD{font-size:168px;font-weight:700;letter-spacing:2px;line-height:1;color:var(--ink)}
.tag{display:inline-block;background:var(--red);color:#fff3dc;padding:4px 12px;font-size:30px;font-weight:700}
.stages{display:flex;gap:6px;margin:10px 0}
.stages>div{flex:1;border:3px solid var(--ink);text-align:center;font-size:20px;padding:4px 0;background:var(--paper2);color:#9a8f7a}
.stages>div.on{background:var(--red);color:#fff}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;font-size:15px}
.recs div{display:flex;justify-content:space-between;border-bottom:2px solid #e2d3ad;padding:2px 0}
.recs .nw{color:var(--red);font-weight:700}
.evrow{display:flex;align-items:stretch;margin:4px 0;height:58px}
.evrow .ck{width:60px;background:var(--paper);border:3px solid var(--ink);font-size:34px;color:var(--red);display:flex;align-items:center;justify-content:center;padding:0}
.evrow .nm{flex:1;background:var(--paper);border:3px solid var(--ink);border-left:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:26px;color:var(--ink)}
.evrow .nm small{font-size:20px}
.evrow .ar{width:60px;font-size:24px;padding:0;margin-left:4px;box-shadow:inset 0 -5px 0 var(--woodD)}
.evrow.off .nm{color:#9a8f7a}
.evrow.soon .nm{background:#d8ccb2;color:#8a7f6a}
.sep{color:#f3ecd9;font-size:22px;border-top:2px dashed var(--yellow);padding-top:6px;margin-top:10px}
.mh{color:var(--yellow);font-size:22px;margin-top:6px}
.rulecard{position:absolute;left:50%;transform:translateX(-50%);background:var(--paper);border:5px solid var(--ink);box-shadow:0 8px 0 rgba(0,0,0,.3);padding:18px 22px;z-index:4}
.rulecard h2{margin:0;color:var(--red);font-size:44px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:4px solid var(--red);padding-bottom:6px}
.rulecard h2 small{font-size:24px;color:var(--ink)}
.rulecard p{font-size:24px;line-height:1.45;margin:10px 0}
.rulecard canvas{display:block;width:100%;image-rendering:pixelated}
.rulecard .bt{text-align:center;font-size:24px;margin-top:8px}
.rulecard .bt b{color:var(--red)}
.cnt{position:absolute;right:18px;top:-6px;font-size:120px;font-weight:700;color:#fff;text-shadow:6px 6px 0 var(--ink),-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink);z-index:5}
.bigban{position:absolute;left:50%;transform:translateX(-50%);background:var(--paper);border:6px solid var(--ink);border-bottom:10px solid var(--red);text-align:center;z-index:4;padding:10px 40px;box-shadow:0 8px 0 rgba(0,0,0,.3)}
.bigban .h{font-size:110px;font-weight:700;color:var(--red);line-height:1.1}
.bigban .h.b{color:var(--blue)}
.bigban .s{font-size:30px}
.msgban{position:absolute;left:50%;top:84px;transform:translateX(-50%);z-index:4;text-align:center;pointer-events:none}
.msgban .a{display:inline-block;background:var(--paper);border:5px solid var(--ink);padding:6px 30px;font-size:56px;font-weight:700;color:var(--red)}
.msgban .a.b{color:var(--blue)}
.msgban .c{display:block;margin:6px auto 0;width:max-content;background:var(--ink);color:#fff;font-size:26px;padding:4px 14px}
.turns{display:flex;gap:6px;justify-content:center}
.turns i{width:52px;height:30px;border:3px solid var(--ink);background:#f3f0e6;display:block}
.turns i.b{background:#8fb5ea}
.turns i.cur{outline:4px solid var(--yellow)}
.stampBtn{position:absolute;bottom:90px;width:300px;height:86px;display:flex;align-items:center;gap:14px;font-size:30px;padding:0 16px;text-align:left;z-index:5}
.stampBtn small{display:block;font-size:18px}
.stampBtn .st{width:62px;height:62px;border-radius:50%;border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:34px;flex:0 0 auto}
.bigStamp{position:absolute;z-index:7;width:240px;height:240px;border-radius:50%;border:12px solid var(--red);color:var(--red);font-size:64px;font-weight:700;display:flex;align-items:center;justify-content:center;transform:rotate(-14deg);background:rgba(250,243,227,.85);animation:stamp .6s ease-out}
@keyframes stamp{0%{transform:scale(2.4) rotate(-14deg);opacity:0}60%{transform:scale(.92) rotate(-14deg);opacity:1}100%{transform:scale(1) rotate(-14deg)}}
.cmeter{position:absolute;left:250px;right:250px;top:448px;height:44px;border:4px solid var(--ink);background:#e2d3ad;z-index:4;display:flex;align-items:center}
.cmeter .fb{background:var(--blue);height:100%}
.cmeter .fw{background:#fff;height:100%}
.cmeter span{position:absolute;font-size:22px;top:6px}
.sheet{position:absolute;background:var(--paper);border:6px double var(--red);outline:4px solid var(--ink);padding:16px 22px}
.sheet table{width:100%;border-collapse:collapse;font-size:28px}
.sheet td,.sheet th{padding:4px 6px;border-bottom:2px solid #e2d3ad}
.sheet th{font-size:22px;text-align:left;border-bottom:4px solid var(--ink)}
.sheet td.n{text-align:center;font-weight:700}
.sheet tr.sum td{background:#e8dcc0}
.sheet td small{display:block;font-size:13px;font-weight:400}
.pcard{display:flex;align-items:center;gap:14px;background:var(--paper);border:4px solid var(--ink);padding:8px 14px;margin-bottom:8px}
.pcard canvas{width:48px;height:62px;image-rendering:pixelated}
.pcard .t{color:var(--red);font-size:20px}
.pcard .n{font-size:32px;font-weight:700}
.pcard .d{font-size:18px}
.hq{display:flex;gap:12px;align-items:center;font-size:25px;color:#f3ecd9;margin-bottom:12px}
.hq i{font-style:normal;background:var(--yellow);color:var(--ink);width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}
.reqs{position:absolute;right:16px;bottom:16px;z-index:20;display:flex;flex-direction:column;gap:8px}
.reqs .paper{padding:10px 14px;font-size:22px;display:flex;align-items:center;gap:10px}
.reqs .btn{font-size:18px;padding:6px 10px}
.qrbig{background:#fff;padding:20px;border:6px solid var(--ink);text-align:center}
.qrbig canvas{width:520px;height:520px;image-rendering:pixelated}
.menu{padding:22px;min-width:420px;text-align:center}
.menu h3{margin:0 0 14px;font-size:34px}
.menu .btn{display:block;width:100%;margin:10px 0;font-size:24px}
.menu input{width:100%;font-size:30px;padding:8px;border:4px solid var(--ink);margin-bottom:8px}
.classgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.classgrid button{background:var(--paper);border:4px solid var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.3);padding:16px 10px;text-align:center;color:var(--ink)}
.classgrid button b{display:block;font-size:34px}
.classgrid button span{display:block;font-size:18px;color:var(--red);margin-top:4px}
.classgrid button small{display:block;font-size:15px;color:#7a6d58;margin-top:6px}
.classgrid button:hover{background:#fff8e6;transform:translateY(-2px)}
.paused{position:absolute;inset:62px 0 0 0;background:rgba(43,45,60,.45);z-index:9;display:flex;align-items:center;justify-content:center;font-size:90px;color:#fff;text-shadow:5px 5px 0 var(--ink);pointer-events:none}
</style>
</head>
<body>
<div id="student" class="hidden">
  <div id="s-home" class="sscreen">
    <div class="bunting multi" style="height:22px"></div>
    <div class="logo">교실 운동회</div>

function ballStep(b, dt, goals) {
  b.x += b.vx * dt; b.y += b.vy * dt;
  const f = Math.pow(0.5, dt); b.vx *= f; b.vy *= f;
  b.spin = (b.spin || 0) + b.vx * dt / (b.r * 6);
  const top = FIELD.y + b.r, bot = FIELD.b - b.r;
  if (b.y < top) { b.y = top; b.vy = Math.abs(b.vy) * 0.7; }
  if (b.y > bot) { b.y = bot; b.vy = -Math.abs(b.vy) * 0.7; }
  const inMouth = goals && Math.abs(b.y - goals.y) < goals.h / 2 - b.r * 0.4;
  if (b.x < FIELD.x + b.r && !inMouth) { b.x = FIELD.x + b.r; b.vx = Math.abs(b.vx) * 0.7; }
  if (b.x > FIELD.r - b.r && !inMouth) { b.x = FIELD.r - b.r; b.vx = -Math.abs(b.vx) * 0.7; }
  if (inMouth) { b.x = clamp(b.x, FIELD.x - 60, FIELD.r + 60); }
}
function ballsCollide(balls) {
  for (let i = 0; i < balls.length; i++) for (let j = i + 1; j < balls.length; j++) {
    const a = balls[i], b = balls[j]; if (a.gone || b.gone) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), m = a.r + b.r;

    }
  }
}
function ballClamp(b, goals) {
  if (b.gone) return;
  b.y = clamp(b.y, FIELD.y + b.r, FIELD.b - b.r);
  const inMouth = goals && Math.abs(b.y - goals.y) < goals.h / 2 - b.r * 0.4;
  if (!inMouth) b.x = clamp(b.x, FIELD.x + b.r, FIELD.r - b.r);
}
function playerPushBall(p, b, dt, power = 1.15) {
  if (b.gone) return false;
  const dx = b.x - p.x, dy = (b.y) - (p.y - 8), d = Math.hypot(dx, dy), m = b.r + 16;
  if (d <= 0 || d >= m) return false;
  const nx = dx / d, ny = dy / d, ov = m - d;

  return true;
}

    const L = teamOf(G, p.team);
    gridSpawn(G, p, p.team === 0 ? { x: 180, y: 260, w: 460, h: 520 } : { x: 960, y: 260, w: 460, h: 520 }, L);
  },
  update(G, es, dt, practice) {
    if (es.mt > 0) es.mt -= dt;
    for (const b of es.balls) {
      if (b.gone > 0) { b.gone -= dt; if (b.gone <= 0) { b.gone = 0; b.x = FIELD.cx; b.y = FIELD.cy + rndi(-1, 1) * 150; b.vx = b.vy = 0; b.last = []; } continue; }
      ballStep(b, dt, GOAL);
      let side = -1;
      if (b.x < FIELD.x - 8) side = 1; else if (b.x > FIELD.r + 8) side = 0;
      if (side >= 0) {
        if (!practice) es.sc[side]++;
        b.gone = 1.6; G.sfx('goal');
        const names = b.last.filter(l => l.team === side).slice(-3).map(l => l.name);
        es.m = [practice ? '연습 골!' : '골!', side, names.join(' · ')]; es.mt = 3;
      }
    }
    ballsCollide(es.balls);
    for (const p of G.players) for (const b of es.balls) {
      if (playerPushBall(p, b, dt)) {
        if (!practice) es.c[p.id] = (es.c[p.id] || 0) + dt;
        const l = b.last; if (!l.length || l[l.length - 1].id !== p.id) { const i = l.findIndex(x => x.id === p.id); if (i >= 0) l.splice(i, 1); l.push({ id: p.id, name: p.name, team: p.team }); if (l.length > 6) l.shift(); }
      }
    }
    for (const b of es.balls) ballClamp(b, GOAL);
  },
  button(G, es, p, practice) {
    if (p.cd > 0) return; let best = null, bd = 1e9;
    for (const b of es.balls) { if (b.gone) continue; const d = Math.hypot(b.x - p.x, b.y - p.y); if (d < b.r + 52 && d < bd) { bd = d; best = b; } }
    if (!best) return;
    p.cd = 0.45;
    const gx = p.team === 0 ? FIELD.r + 40 : FIELD.x - 40, gy = GOAL.y;
    let ax = gx - best.x, ay = gy - best.y; let al = Math.hypot(ax, ay) || 1; ax /= al; ay /= al;
    let bx = best.x - p.x, by = best.y - p.y; let bl = Math.hypot(bx, by) || 1; bx /= bl; by /= bl;
    let dx = ax * 0.55 + bx * 0.45, dy = ay * 0.55 + by * 0.45; const dl = Math.hypot(dx, dy) || 1;
    best.vx += dx / dl * 360; best.vy += dy / dl * 360;
    if (!practice) es.c[p.id] = (es.c[p.id] || 0) + 0.4;
    const l = best.last; const i = l.findIndex(x => x.id === p.id); if (i >= 0) l.splice(i, 1); l.push({ id: p.id, name: p.name, team: p.team });
    G.sfx('pop');
  },
  snap(es) { return { b: es.balls.map(b => [b.x | 0, b.y | 0, b.gone ? 1 : 0, +(b.spin || 0).toFixed(2)]), m: es.mt > 0 ? es.m : null }; },
  result(es, G) { return { raw: es.sc.slice(), win: winOf(es.sc[0], es.sc[1]), stat: es.sc[0] + es.sc[1] }; },
  ground(ctx, o, t) {

    ctx.beginPath(); ctx.moveTo(FIELD.cx, FIELD.y); ctx.lineTo(FIELD.cx, FIELD.b); ctx.stroke();
    ctx.beginPath(); ctx.arc(FIELD.cx, FIELD.cy, 100, 0, 7); ctx.stroke();
    for (const s of [0, 1]) {

      ctx.strokeStyle = COL.line; ctx.strokeRect(s ? FIELD.r - 120 : FIELD.x, GOAL.y - 150, 120, 300);
      // 골대
      ctx.fillStyle = s ? 'rgba(52,105,192,.22)' : 'rgba(255,255,255,.35)';
      ctx.fillRect(s ? x0 : x0 - 52, GOAL.y - GOAL.h / 2, 52, GOAL.h);
      ctx.strokeStyle = COL.ink; ctx.lineWidth = 4; ctx.strokeRect(s ? x0 : x0 - 52, GOAL.y - GOAL.h / 2, 52, GOAL.h);
      ctx.strokeStyle = 'rgba(43,45,60,.35)'; ctx.lineWidth = 1;
      for (let k = 1; k < 6; k++) { ctx.beginPath(); ctx.moveTo(s ? x0 : x0 - 52, GOAL.y - GOAL.h / 2 + k * GOAL.h / 6); ctx.lineTo(s ? x0 + 52 : x0, GOAL.y - GOAL.h / 2 + k * GOAL.h / 6); ctx.stroke(); }
      ctx.fillStyle = s ? COL.blue : '#fff'; ctx.strokeStyle = COL.ink; ctx.lineWidth = 2;
      ctx.font = 'bold 18px Galmuri11, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.strokeText(s ? '백 골문' : '청 골문', x0 + dir * 26, GOAL.y - GOAL.h / 2 - 16); ctx.fillText(s ? '백 골문' : '청 골문', x0 + dir * 26, GOAL.y - GOAL.h / 2 - 16);
    }
  },
  items(ctx, o, t, L) { for (const b of o.b || []) if (!b[2]) L.push({ y: b[1] + 30, d: () => drawBigBall(ctx, b[0], b[1], 34, t, b[3]) }); },
  msg(o) { return o.m ? { text: o.m[0], sub: o.m[2] ? `${TEAMN[o.m[1]]} · ${o.m[2]}` : TEAMN[o.m[1]], team: o.m[1] } : null; },

    const bx = w * 0.45 + Math.sin(t * 2) * 20;

const TUG = { y: 520, period: 0.75, win: 140, roundT: 40 };
EVENTS.tug = {
  id: 'tug', name: '줄다리기', btn: '영차', dur: 150, est: 180, ready: true, move: false, noReplay: true, beat: true,
  rule: '저절로 줄에 서요. 북이 둥! 울릴 때 [영차]를 눌러요. 마구 누르면 힘이 빠져요. 3판 2선승!',
  stat: { unit: '번', fmt: v => `1인당 ${v}번` },
  line: n => `박자에 맞춰 ${n}번 영차 했어요`,
  praise: { title: '박자를 잘 맞췄어요', det: n => `영차 ${n}번` },
  setup(G) { return { r: 0, round: 1, w: [0, 0], rt: 0, bt: 0, beat: 0, st: 'pull', pt: 0, last: {}, c: {}, sc: [0, 0], m: null, mt: 0, done: false, good: 0 }; },
  layout(G, es) {
    for (const t of [0, 1]) {
      const L = teamOf(G, t), n = L.length, per = Math.ceil(n / 2), sp = Math.min(62, 560 / Math.max(1, per));
      L.forEach((p, i) => { const k = Math.floor(i / 2), row = i % 2; p.x = (t === 0 ? 760 - k * sp - row * sp / 2 : 840 + k * sp + row * sp / 2) + es.r; p.y = TUG.y + (row ? 22 : -18); p.flip = t === 1; });
    }
  },
  spawn(G, p, es) { this.layout(G, es); },
  update(G, es, dt, practice) {
    if (es.mt > 0) es.mt -= dt;
    if (es.done) { this.layout(G, es); return; }
    if (es.st === 'pause') {
      es.pt -= dt; if (es.pt <= 0) { es.st = 'pull'; es.r = 0; es.rt = 0; }
      this.layout(G, es); return;
    }
    es.rt += dt; es.bt += dt;
    if (es.bt >= TUG.period) {
      es.bt -= TUG.period; es.beat++; G.sfx('drum', es.beat % 2);
      const f = [0, 0], n = [0, 0];
      for (const p of G.players) {
        const L = es.last[p.id] || { g: p.in.g || 0, m: p.in.m || 0 };
        const g = (p.in.g || 0) - L.g, m = (p.in.m || 0) - L.m;
        es.last[p.id] = { g: p.in.g || 0, m: p.in.m || 0 };
        n[p.team]++;
        if (g >= 1 && m <= 1) { f[p.team]++; if (!practice) { es.c[p.id] = (es.c[p.id] || 0) + 1; es.good++; } p.pull = 0.3; }
      }
      const fb = f[0] / Math.max(1, n[0]), fw = f[1] / Math.max(1, n[1]);
      es.r += (fw - fb) * 18;
    }
    let end = -2;
    if (Math.abs(es.r) >= TUG.win) end = es.r < 0 ? 0 : 1;
    else if (es.rt >= TUG.roundT) end = Math.abs(es.r) > 8 ? (es.r < 0 ? 0 : 1) : -1;

      if (practice) { es.r = 0; es.rt = 0; }

        if (end >= 0) es.w[end]++;

        else { es.st = 'pause'; es.pt = 3.5; }
      }
    }
    es.sc = es.w.slice();
    this.layout(G, es);
  },
  isDone(es) { return es.done && es.mt <= 0; },
  timeLeft(es) { return es.st === 'pause' ? TUG.roundT : TUG.roundT - es.rt; },
  snap(es) { return { r: Math.round(es.r), w: es.w, rd: Math.min(3, es.round), bp: +(es.bt / TUG.period).toFixed(3), per: TUG.period, ps: es.st === 'pause' || es.done ? 1 : 0, m: es.mt > 0 ? es.m : null }; },
  result(es, G) {
    const n = G.players.length || 1;
    return { raw: es.w.slice(), win: winOf(es.w[0], es.w[1]), stat: Math.round(es.good / n), rawLabel: '판' };
  },
  ground(ctx, o, t) {
    drawFieldBox(ctx);
    ctx.strokeStyle = COL.line; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(FIELD.cx, FIELD.y); ctx.lineTo(FIELD.cx, FIELD.b); ctx.stroke();
    for (const s of [-1, 1]) {
      const x = FIELD.cx + s * TUG.win;
      ctx.strokeStyle = s < 0 ? COL.blue : '#fff'; ctx.lineWidth = 6; ctx.setLineDash([16, 10]);
      ctx.beginPath(); ctx.moveTo(x, TUG.y - 120); ctx.lineTo(x, TUG.y + 120); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.font = 'bold 22px Galmuri11'; ctx.textAlign = 'center'; ctx.fillStyle = COL.ink;
    ctx.fillText('여기까지 당기면 청팀', FIELD.cx - TUG.win - 20, TUG.y + 150); ctx.fillText('여기까지 당기면 백팀', FIELD.cx + TUG.win + 20, TUG.y + 150);
  },
  items(ctx, o, t, L) {
    const r = o.r || 0;
    L.push({
      y: TUG.y + 1, d: () => {
        ctx.strokeStyle = '#7a5128'; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(150 + r, TUG.y - 6); ctx.lineTo(1450 + r, TUG.y - 6); ctx.stroke();
        ctx.strokeStyle = '#c4935a'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(150 + r, TUG.y - 8); ctx.lineTo(1450 + r, TUG.y - 8); ctx.stroke();
        ctx.fillStyle = '#d63a2c'; ctx.fillRect(FIELD.cx + r - 8, TUG.y - 30, 16, 40); ctx.strokeStyle = COL.ink; ctx.lineWidth = 3; ctx.strokeRect(FIELD.cx + r - 8, TUG.y - 30, 16, 40);
      }
    });
  },
  over(ctx, o, t) {
    // 북 박자
    const ph = o.bp || 0, s = 1 + Math.max(0, 1 - ph * 4) * 0.3;
    ctx.save(); ctx.translate(FIELD.cx, 300); ctx.scale(s, s);
    ctx.fillStyle = COL.ink; ctx.beginPath(); ctx.ellipse(0, 0, 46, 34, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#d63a2c'; ctx.fillRect(-42, -6, 84, 30); ctx.fillStyle = '#e8d6b0'; ctx.beginPath(); ctx.ellipse(0, -6, 42, 22, 0, 0, 7); ctx.fill();
    ctx.restore();
    ctx.font = 'bold 20px Galmuri11'; ctx.textAlign = 'center'; ctx.fillStyle = COL.ink; ctx.fillText(`${o.rd || 1}판 · 청 ${(o.w || [0, 0])[0]} : ${(o.w || [0, 0])[1]} 백`, FIELD.cx, 370);
  },
  msg(o) { return o.m ? { text: o.m[0], sub: o.m[2], team: o.m[1] } : null; },
  card(ctx, w, h, t) {
    ctx.fillStyle = COL.ground; ctx.fillRect(0, 0, w, h);
    const r = Math.sin(t * 1.5) * 12;
    ctx.strokeStyle = '#7a5128'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(20 + r, h / 2 + 10); ctx.lineTo(w - 20 + r, h / 2 + 10); ctx.stroke();
    drawChar(ctx, lookFromName('d'), 0, w / 2 - 60 + r, h / 2 + 30, {}); drawChar(ctx, lookFromName('e'), 1, w / 2 + 60 + r, h / 2 + 30, { flip: true });
    ctx.fillStyle = '#d63a2c'; ctx.fillRect(w / 2 - 5 + r, h / 2 - 6, 10, 26);
  },
};

// ================= 2차에 들어갈 종목(목록에는 보이되 아직 못 골라요) =================
const SOON = {

  mugung: ['무궁화 꽃이 피었습니다', null, 200, "구호가 켜질 때만 달려요. '다!'에 움직이면 출발선으로."],

for (const [id, v] of Object.entries(SOON)) if (!EVENTS[id]) EVENTS[id] = { id, name: v[0], btn: v[1], est: v[2], rule: v[3], ready: false, soon: true };

// ===================== 2차 종목 =====================
const B_A = 1 << 10, B_B = 1 << 11, B_C = 1 << 12, B_T = 1 << 13;
function halfRect(t, pad = 0) { return t === 0 ? { x: FIELD.x + 60 + pad, y: FIELD.y + 40, w: FIELD.w / 2 - 120 - pad, h: FIELD.h - 80 } : { x: FIELD.cx + 60, y: FIELD.y + 40, w: FIELD.w / 2 - 120 - pad, h: FIELD.h - 80 }; }
function segDist(px, py, ax, ay, bx, by) { const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1; let t = ((px - ax) * dx + (py - ay) * dy) / l2; t = clamp(t, 0, 1); return [Math.hypot(px - ax - dx * t, py - ay - dy * t), t]; }
function nearest(list, x, y, f) { let b = null, bd = 1e12; for (const q of list) { if (f && !f(q)) continue; const d = dist2(q.x, q.y, x, y); if (d < bd) { bd = d; b = q; } } return b; }
function clampField(o, m = 20) { o.x = clamp(o.x, FIELD.x + m, FIELD.r - m); o.y = clamp(o.y, FIELD.y + m, FIELD.b - m); }
function centerLine(ctx) { drawFieldBox(ctx); ctx.strokeStyle = COL.line; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(FIELD.cx, FIELD.y); ctx.lineTo(FIELD.cx, FIELD.b); ctx.stroke(); }
function label(ctx, txt, x, y, size = 20, col = COL.ink) { ctx.font = `bold ${size}px Galmuri11, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText(txt, x, y); ctx.fillStyle = col; ctx.fillText(txt, x, y); }
function drawBag(ctx, x, y, col = '#d8452f') { ctx.fillStyle = COL.ink; ctx.fillRect(x - 8, y - 7, 16, 14); ctx.fillStyle = col; ctx.fillRect(x - 6, y - 5, 12, 10); ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fillRect(x - 6, y - 5, 12, 3); }
function msgOf(o) { return o.m ? { text: o.m[0], sub: o.m[2] || '', team: o.m[1] } : null; }
function tick(es, dt) { if (es.mt > 0) es.mt -= dt; }
function setMsg(es, a, team, b, t = 3) { es.m = [a, team, b || '']; es.mt = t; }
function addC(es, p, n = 1, practice) { if (!practice) es.c[p.id] = (es.c[p.id] || 0) + n; }

// ================= 3. 박 터뜨리기 =================
const BAK = [[1180, 470], [420, 470]]; // 청팀 박은 오른쪽, 백팀 박은 왼쪽
EVENTS.bak = {
  id: 'bak', name: '박 터뜨리기', btn: '던지기', dur: 180, est: 260, ready: true, move: true,
  rule: '오자미를 주워 우리 팀 박에 [던지기]! 조준은 저절로 돼요. 던지는 길에 상대가 서 있으면 막혀요. 먼저 박을 터뜨리면 이겨요.',
  hq: '누가 던지고, 누가 상대 길을 막을까?',
  stat: { fmt: v => `명중 ${v}개` }, line: n => `박에 ${n}번 맞혔어요`, praise: { title: '박에 많이 맞혔어요', det: n => `명중 ${n}번` },
  setup(G) {
    const need = [0, 1].map(t => clamp(Math.round(teamOf(G, t).length * 4), 20, 64));
    const bags = []; for (let i = 0; i < 46; i++) bags.push({ x: rnd(FIELD.x + 40, FIELD.r - 40), y: rnd(FIELD.y + 60, FIELD.b - 30) });
    return { bags, fly: [], hp: [0, 0], need, sc: [0, 0], c: {}, carry: {}, last: [[], []], burst: -1, bt: 0, m: null, mt: 0, hits: 0 };
  },
  spawn(G, p) { gridSpawn(G, p, p.team === 0 ? { x: 160, y: 270, w: 380, h: 500 } : { x: 1060, y: 270, w: 380, h: 500 }, teamOf(G, p.team)); },
  update(G, es, dt, practice) {
    tick(es, dt);
    if (es.burst >= 0) { es.bt += dt; return; }
    for (const p of G.players) {
      if (es.carry[p.id]) continue;
      for (let i = 0; i < es.bags.length; i++) { const b = es.bags[i]; if (dist2(b.x, b.y, p.x, p.y) < 32 * 32) { es.carry[p.id] = 1; es.bags.splice(i, 1); break; } }
    }
    for (const f of es.fly) f.t += dt / f.d;
    for (const f of es.fly) {
      if (f.t < 1) continue;
      if (f.hit && es.burst < 0) {
        es.hp[f.team]++; G.sfx('pop', 0.05);
        if (!practice) { es.c[f.pid] = (es.c[f.pid] || 0) + 1; es.hits++; }
        const L = es.last[f.team]; const i = L.indexOf(f.name); if (i >= 0) L.splice(i, 1); L.push(f.name); if (L.length > 3) L.shift();
        if (es.hp[f.team] >= es.need[f.team]) {
          if (practice) es.hp[f.team] = 0;
          else { es.burst = f.team; G.sfx('goal'); setMsg(es, '박이 터졌어요!', f.team, `${TEAMN[f.team]} · ${es.last[f.team].join(' · ')}`, 4); }
        }
      }
      const b = { x: f.x1 + rnd(-110, 110), y: f.y1 + 60 + rnd(-90, 90) }; clampField(b, 30); es.bags.push(b);
    }
    es.fly = es.fly.filter(f => f.t < 1);
    es.sc = es.hp.slice();
  },
  isDone(es) { return es.burst >= 0 && es.bt > 3.5; },
  button(G, es, p) {
    if (!es.carry[p.id] || es.burst >= 0) return;
    es.carry[p.id] = 0;
    const [bx, by0] = BAK[p.team], by = by0 - 70;
    let d = Math.hypot(bx - p.x, by - p.y), ex = bx, ey = by, hit = true;
    if (d > 480) { ex = p.x + (bx - p.x) / d * 480; ey = p.y + (by - p.y) / d * 480; hit = false; d = 480; }
    let bt = 2;
    for (const q of G.players) {
      if (q.team === p.team) continue;
      const [sd, t] = segDist(q.x, q.y - 20, p.x, p.y - 30, ex, ey);
      if (sd < 26 && t > 0.08 && t < 0.97 && t < bt) { bt = t; }
    }
    if (bt < 2) { hit = false; ex = p.x + (ex - p.x) * bt; ey = p.y - 30 + (ey - p.y + 30) * bt; }
    es.fly.push({ x0: p.x, y0: p.y - 30, x1: ex, y1: ey, t: 0, d: Math.max(0.25, Math.hypot(ex - p.x, ey - p.y) / 700), hit, team: p.team, pid: p.id, name: p.name });
  },
  pflags(es, p) { return es.carry[p.id] ? B_A : 0; },
  snap(es) {
    const bg = []; for (const b of es.bags) bg.push(b.x | 0, b.y | 0);
    return { bg, f: es.fly.map(f => [f.x0 | 0, f.y0 | 0, f.x1 | 0, f.y1 | 0, +f.t.toFixed(2), f.hit ? 1 : 0]), hp: es.hp, nd: es.need, bu: es.burst, m: es.mt > 0 ? es.m : null };
  },
  result(es) {
    let w = es.burst;
    if (w < 0) w = winOf(es.hp[0] / es.need[0], es.hp[1] / es.need[1], 0.001);
    return { raw: es.hp.slice(), win: w, stat: es.hits, rawLabel: '' };
  },
  ground(ctx, o) {
    centerLine(ctx);
    const bg = o.bg || []; for (let i = 0; i < bg.length; i += 2) drawBag(ctx, bg[i], bg[i + 1], i % 4 ? '#d8452f' : '#e3a531');
  },
  items(ctx, o, t, L) {
    [0, 1].forEach(tm => {
      const [x, y] = BAK[tm], hp = (o.hp || [0, 0])[tm], nd = (o.nd || [20, 20])[tm], br = o.bu === tm;
      L.push({
        y, d: () => {
          ctx.fillStyle = 'rgba(43,45,60,.25)'; ctx.beginPath(); ctx.ellipse(x, y, 30, 9, 0, 0, 7); ctx.fill();
          ctx.fillStyle = COL.ink; ctx.fillRect(x - 4, y - 130, 8, 132); ctx.fillStyle = '#c9a26a'; ctx.fillRect(x - 2, y - 128, 4, 128);
          ctx.fillStyle = COL.ink; ctx.fillRect(x - 40, y - 132, 80, 6);
          const cy = y - 82;
          if (br) {
            for (let k = 0; k < 14; k++) { ctx.fillStyle = pick(['#e74c3c', '#f1c40f', '#3498db', '#2ecc71', '#fff']); ctx.fillRect(x + Math.sin(k * 7 + t * 3) * 70, cy + 20 + ((t * 60 + k * 23) % 100), 6, 10); }
            ctx.fillStyle = tm === 0 ? COL.blue : '#f3f0e6'; ctx.strokeStyle = COL.ink; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(x - 18, cy, 40, Math.PI * 0.5, Math.PI * 1.5); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(x + 18, cy, 40, -Math.PI * 0.5, Math.PI * 0.5); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#fff'; ctx.fillRect(x - 12, cy - 30, 24, 90); ctx.strokeRect(x - 12, cy - 30, 24, 90);
            ctx.save(); ctx.translate(x, cy + 15); ctx.font = 'bold 15px Galmuri11'; ctx.fillStyle = COL.red; ctx.textAlign = 'center';
            ['축', '승', '리'].forEach((c, i) => ctx.fillText(c, 0, -14 + i * 18)); ctx.restore();
          } else {
            ctx.fillStyle = COL.ink; ctx.beginPath(); ctx.arc(x, cy, 44, 0, 7); ctx.fill();
            ctx.fillStyle = tm === 0 ? COL.blue : '#f3f0e6'; ctx.beginPath(); ctx.arc(x, cy, 40, 0, 7); ctx.fill();
            ctx.fillStyle = tm === 0 ? '#fff' : COL.blue; ctx.beginPath(); ctx.moveTo(x, cy); ctx.arc(x, cy, 40, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, hp / nd)); ctx.closePath(); ctx.globalAlpha = 0.45; ctx.fill(); ctx.globalAlpha = 1;
            ctx.strokeStyle = COL.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - 40, cy); ctx.lineTo(x + 40, cy); ctx.stroke();
          }
          label(ctx, `${TEAM[tm]} 박 ${Math.min(hp, nd)}/${nd}`, x, y + 20, 18, tm === 0 ? COL.blue : COL.ink);
        }

    });
  },
  over(ctx, o) {
    for (const f of o.f || []) { const x = lerp(f[0], f[2], f[4]), y = lerp(f[1], f[3], f[4]) - Math.sin(Math.PI * f[4]) * 70; drawBag(ctx, x, y); }
  },
  pdraw(ctx, q, r, t, o, lift) { if (q.f & B_A) drawBag(ctx, q.x + (q.f & 1 ? -16 : 16), q.y - 34 - lift, '#d8452f'); },
  msg: msgOf,
  myBanner(o, f, team) { return (f & B_A) ? { b1: '오자미를 들었어요', b2: `${TEAM[team]} 박 가까이 가서 [던지기]` , blue: team === 0} : { b1: '오자미를 주워요', b2: '땅에 떨어진 오자미에 닿으면 주워요' }; },
  bot(G, es, p, inp) {
    if (es.carry[p.id]) { const [bx, by] = BAK[p.team]; if (dist2(bx, by, p.x, p.y) < 320 * 320) { if (Math.random() < 0.08) inp.b = (inp.b || 0) + 1; return null; } return [bx, by + 60]; }
    if (p.id % 3 === 0) { const [bx, by] = BAK[1 - p.team]; return [bx + (p.team ? 120 : -120), by + rnd(-30, 60)]; }
    const b = nearest(es.bags, p.x, p.y); return b ? [b.x, b.y] : null;
  },
  card(ctx, w, h, t) {
    ctx.fillStyle = COL.ground; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = COL.ink; ctx.fillRect(w - 64, 20, 6, h - 30); ctx.fillStyle = COL.blue; ctx.beginPath(); ctx.arc(w - 61, 40, 26, 0, 7); ctx.fill(); ctx.strokeStyle = COL.ink; ctx.lineWidth = 3; ctx.stroke();
    drawChar(ctx, lookFromName('f'), 0, 70, h - 20, {});
    const ph = (t * 0.8) % 1; drawBag(ctx, lerp(90, w - 70, ph), lerp(h - 70, 46, ph) - Math.sin(ph * Math.PI) * 40);
  },

// ================= 5. 꼬리잡기 =================
const TBASK = [[160, FIELD.cy], [1440, FIELD.cy]];
EVENTS.tail = {
  id: 'tail', name: '꼬리잡기', btn: '뺏기', dur: 120, est: 200, ready: true, move: true,
  rule: '상대 등 뒤로 가서 [뺏기]로 꼬리를 뺏어요. 뺏은 꼬리는 우리 바구니에 넣어야 1점! 꼬리를 뺏겨도 4초 뒤 다시 생겨요.',
  hq: '누가 뺏으러 가고, 누가 바구니를 지킬까?',
  stat: { fmt: v => `꼬리 ${v}개` }, line: n => `꼬리 ${n}개를 바구니에 넣었어요`, praise: { title: '꼬리를 많이 넣었어요', det: n => `꼬리 ${n}개` },
  setup() { return { tail: {}, carry: {}, regrow: {}, sc: [0, 0], c: {}, m: null, mt: 0, tot: 0 }; },
  spawn(G, p, es) { gridSpawn(G, p, halfRect(p.team), teamOf(G, p.team)); es.tail[p.id] = true; es.carry[p.id] = 0; },
  update(G, es, dt, practice) {
    tick(es, dt);
    for (const p of G.players) {
      if (es.tail[p.id] == null) es.tail[p.id] = true;
      if (!es.tail[p.id]) { es.regrow[p.id] = (es.regrow[p.id] || 0) - dt; if (es.regrow[p.id] <= 0) es.tail[p.id] = true; }
      const [bx, by] = TBASK[p.team];
      if (es.carry[p.id] > 0 && dist2(p.x, p.y, bx, by) < 74 * 74) {
        const n = es.carry[p.id]; es.carry[p.id] = 0;
        if (!practice) { es.sc[p.team] += n; es.tot += n; } addC(es, p, n, practice); G.sfx('pop');
      }
    }
  },
  button(G, es, p) {
    if (p.cd > 0 || (es.carry[p.id] || 0) >= 3) return;
    let best = null, bd = 1e9;
    for (const q of G.players) {
      if (q.team === p.team || !es.tail[q.id]) continue;
      const d = Math.hypot(q.x - p.x, q.y - p.y); if (d > 56) continue;
      const fx = q.flip ? -1 : 1, behind = (p.x - q.x) * fx < 8;
      if ((behind || d < 30) && d < bd) { bd = d; best = q; }
    }
    p.cd = 0.35; if (!best) return;
    es.tail[best.id] = false; es.regrow[best.id] = 4; es.carry[p.id] = (es.carry[p.id] || 0) + 1; G.sfx('beep');
  },
  pflags(es, p) { return (es.tail[p.id] ? B_A : 0) | (Math.min(3, es.carry[p.id] || 0) << 11); },
  snap(es) { return { m: es.mt > 0 ? es.m : null }; },
  result(es, G) { const n = normScore(es.sc, [teamOf(G, 0).length, teamOf(G, 1).length]); return { raw: es.sc.slice(), win: winOf(n[0], n[1], 0.49), stat: es.tot }; },
  ground(ctx) {
    centerLine(ctx);
    TBASK.forEach(([x, y], tm) => {
      ctx.fillStyle = 'rgba(43,45,60,.25)'; ctx.beginPath(); ctx.ellipse(x, y + 26, 46, 12, 0, 0, 7); ctx.fill();

    let tx = B.tx, ty = B.ty;
    if (G.ph === 'play' || G.ph === 'prep' || G.ph === 'countdown') {
      if (ev.id === 'ball') { const b = es.balls.filter(b => !b.gone).sort((a, c) => dist2(a.x, a.y, p.x, p.y) - dist2(c.x, c.y, p.x, p.y))[0]; if (b) { tx = b.x + (p.team === 0 ? -40 : 40); ty = b.y + rnd(-10, 10); if (dist2(b.x, b.y, p.x, p.y) < 80 * 80 && Math.random() < 0.05) inp.b = (inp.b || 0) + 1; } }
      else if (ev.id === 'hurdle') { const f = HFLAGS[es.nf[p.id] || 0]; tx = f[0]; ty = f[1]; const nearH = HURDLES.some(h => { const cx = clamp(p.x, h[0], h[0] + h[2]), cy = clamp(p.y, h[1], h[1] + h[3]); return dist2(cx, cy, p.x, p.y) < 40 * 40; }); if (Math.random() < (nearH ? 0.15 : 0.03)) inp.b = (inp.b || 0) + 1; }
      else if (ev.id === 'tug') { if (es.bt < 0.04 && Math.random() < (p.ai ? AI.beat : 0.75)) inp.g = (inp.g || 0) + 1; if (Math.random() < 0.01) inp.m = (inp.m || 0) + 1; }
      else if (ev.bot) { const r = ev.bot(G, es, p, inp, B); if (r) { tx = r[0]; ty = r[1]; } else { tx = p.x; ty = p.y; } }
      else if (B.t <= 0) { B.tx = rnd(FIELD.x + 40, FIELD.r - 40); B.ty = rnd(FIELD.y + 40, FIELD.b - 40); B.t = rnd(1, 3); }
    } else if (G.ph === 'cheer') {
      const turn = Math.floor(G.pt / 3); if (turn % 2 === p.team && Math.random() < (p.ai ? 0.12 : 0.25)) inp.d = (inp.d || 0) + 1;
    } else if (B.t <= 0) { B.tx = rnd(FIELD.x + 40, FIELD.r - 40); B.ty = rnd(FIELD.y + 40, FIELD.b - 40); B.t = rnd(1, 4); }
    if (p.ai) {
      // 반응이 늦고(목표를 가끔만 다시 봄), 가끔 멍하니 서 있어요
      B.rt = (B.rt || 0) - dt; B.idle = (B.idle || 0) - dt;
      if (B.rt <= 0 || B.ax == null) { B.ax = tx + rnd(-AI.wobble, AI.wobble); B.ay = ty + rnd(-AI.wobble, AI.wobble); B.rt = rnd(AI.react[0], AI.react[1]); }
      tx = B.ax; ty = B.ay;
      if (B.idle <= 0 && Math.random() < AI.idleChance * dt) B.idle = rnd(0.6, 1.6);
      if (B.idle > 0) { tx = p.x; ty = p.y; }
    }
    const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
    if (d > 12) { inp.jx = dx / d * 0.9; inp.jy = dy / d * 0.9; } else { inp.jx = inp.jy = 0; }
    if (p.lastB == null) p.lastB = 0;
    const nb = (inp.b || 0) - p.lastB; p.lastB = inp.b || 0;
    if (nb > 0 && !(p.ai && (B.idle > 0 || Math.random() > AI.press))) onButton(p);
    if (Math.random() < 0.02) p.lastMove = nowS();
  }
}

// ===================== 학생(태블릿) =====================
const C = {
  net: null, room: '', cid: null, pid: null, name: '', team: 0, S: null, M: null, R: {}, recvT: 0, pos: new Map(),
  inp: { jx: 0, jy: 0, b: 0, d: 0, g: 0, m: 0 }, lastSend: 0, lastSentKey: '', keys: {}, myDrum: 0, cheerNo: -1, beatBase: 0, beatPer: 0.75, flash: null,
  ovKey: '', t0: performance.now(), lost: false, closed: false, P: {},

function sStore(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem('sd-' + (Q.get('seat') || '') + k) || 'null'); localStorage.setItem('sd-' + (Q.get('seat') || '') + k, JSON.stringify(v)); } catch (e) { return null; } }
function showS(id) { for (const e of $$('.sscreen,#play')) e.classList.add('hidden'); $(id).classList.remove('hidden'); }

}
function studentStart() {

  addEventListener('keydown', (e) => { if (!$('#s-home').classList.contains('hidden')) { if (/^\d$/.test(e.key) && C.room.length < 5) { C.room += e.key; drawCode(); } else if (e.key === 'Backspace') { C.room = C.room.slice(0, -1); drawCode(); } else if (e.key === 'Enter') tryJoin(); } });

  $('#diceBtn').onclick = () => { $('#nameIn').value = pick(ANIMALS); drawPreview(); };

function drawCode() { $$('#codebox div').forEach((d, i) => d.textContent = C.room[i] || ''); $('#joinBtn').disabled = C.room.length !== 5; }
function drawPreview() {

}
async function tryJoin() {
  if (C.room.length !== 5) return;
  sMsg('연결 중이에요', `${C.room}번 방을 찾고 있어요`);
  if (C.net) C.net.close();
  C.net = new ClientNet(C.room, C.cid, onClientMsg);
  C.net.onLost = (closed) => onLost(closed);
  try { await C.net.connect(); }
  catch (e) {
    const noroom = e.message === 'noroom';
    sMsg(noroom ? '방을 못 찾았어요' : '연결이 안 돼요', noroom ? '방 번호를 다시 확인해요.' : '학교 인터넷에서 막혔을 수 있어요. 선생님께 알려요.', [['다시 해 보기', tryJoin, 'red'], ['번호 다시 쓰기', () => { C.room = ''; drawCode(); showS('#s-home'); }]]);
    return;
  }
  C.lost = false; C.closed = false;
  const saved = sStore('me');
  if (saved && saved.room === C.room && saved.name) {
    if (C.auto) { C.net.send({ t: 'A', a: 'hello', pid: saved.pid, name: saved.name }); return; }
    sMsg('다시 들어가는 중이에요', '잠깐만 기다려요');
    C.pid = null;
    setTimeout(() => {
      if (C.pid != null || C.closed) return;
      sMsg(`${saved.name}(으)로 돌아갈까요?`, '아까 이 태블릿으로 들어왔던 이름이에요.', [[`${saved.name}예요`, () => C.net.send({ t: 'A', a: 'hello', pid: saved.pid, name: saved.name }), 'red'], ['아니에요', () => { sStore('me', null); goName(); }, 'light']]);
    }, 1800);
  } else goName();
}
function goName() { showS('#s-name'); $('#nameSub').textContent = `${C.room}번 방 · 성은 빼고 이름만 써요. 이름이 싫으면 주사위!`; $('#nameMsg').textContent = ''; $('#askRow').classList.add('hidden'); drawPreview(); setTimeout(() => $('#nameIn').focus(), 50); }
function doJoin() {
  const n = $('#nameIn').value.trim(); if (!n) { $('#nameMsg').textContent = '이름을 써요'; return; }
  C.net.send({ t: 'A', a: 'join', name: n }); $('#nameMsg').textContent = '들어가는 중…';
}
function onLost(closed) {
  if (C.closed) return;
  C.lost = true;
  if (closed) { C.closed = true; sMsg('방이 닫혔어요', '오늘 운동회 수고했어요!', [['처음으로', () => location.href = location.pathname, 'red']]); return; }
  // 다시 붙기
  setTimeout(async () => { if (!C.lost) return; C.auto = true; await tryJoin(); }, 1500);
}
function onClientMsg(m) {
  if (!m || !m.t) return;
  if (m.t === 'S') { C.S = m; C.recvT = performance.now(); const bo = m.o && (m.o.bt ? { bp: m.o.bt[C.team][0], per: m.o.bt[C.team][1], ps: m.o.bt[C.team][2] } : (m.o.per ? m.o : null));
    C.beatPs = bo ? !!bo.ps : false;
    if (bo) {
      const base = C.recvT / 1000 - bo.bp * bo.per; C.beatPer = bo.per;
      if (!C.beatBase) C.beatBase = base;
      else { const d0 = base - C.beatBase, d = d0 - Math.round(d0 / C.beatPer) * C.beatPer; C.beatBase += Math.abs(d) > 0.2 ? d : d * 0.2; }
    }
    return;
  }
  if (m.t === 'M') {
    if (m.closed) { C.closed = true; C.net && C.net.close(); sMsg('방이 닫혔어요', '오늘 운동회 수고했어요!', [['처음으로', () => location.href = location.pathname, 'red']]); return; }
    C.M = m; C.R = rosterMap(m.roster); return;
  }
  if (m.t === 'P') {
    if (m.kicked) { C.net && C.net.close(); sStore('me', null); C.pid = null; sMsg(m.why === 'moved' ? '다른 태블릿으로 옮겼어요' : '방에서 나왔어요', m.why === 'moved' ? '이 태블릿은 이제 쉬어요.' : '다시 들어오려면 방 번호를 눌러요.', [['처음으로', () => location.href = location.pathname, 'red']]); return; }
    if (m.err === 'taken') { showS('#s-name'); $('#nameMsg').innerHTML = `'${esc(m.name)}' 이름이 벌써 있어요.<br>내 이름이 맞으면 <b>부탁하기</b>를 눌러 선생님께 들여보내 달라고 해요.`; $('#askRow').classList.remove('hidden'); return; }
    if (m.err === 'full') { $('#nameMsg').textContent = '방이 가득 찼어요 (36명)'; return; }
    if (m.err === 'denied') { goName(); $('#nameMsg').textContent = '선생님이 거절했어요. 다른 이름을 써요.'; return; }
    if (m.err) { $('#nameMsg').textContent = '다시 해 봐요'; return; }
    if (m.wait) { sMsg('선생님을 기다려요', `TV에서 선생님이 <b>들여보내기</b>를 누르면 '${esc(m.name)}'(으)로 들어가요.`); return; }
    if (m.need === 'name') { sStore('me', null); goName(); return; }
    if (m.pong) return;
    if (m.pid != null) {
      const first = C.pid == null || $('#play').classList.contains('hidden');
      C.pid = m.pid; C.name = m.name; C.team = m.team; C.P = m;
      sStore('me', { room: C.room, pid: m.pid, name: m.name });
      if (first) enterPlay();
      $('#play').classList.toggle('t1', C.team === 1);
      $('#hTeam').textContent = TEAMN[C.team]; $('#hName').textContent = `${C.name} · ${C.room}번 방`;
    }
  }
}

// ---------- 조작 ----------
function setupControls() {
  const joy = $('#joy'), knob = $('#joy .k'); let jid = null;
  const setJ = (e) => {
    const r = joy.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, R = r.width / 2;
    let dx = (e.clientX - cx) / R, dy = (e.clientY - cy) / R; const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; }
    C.joy = { x: dx, y: dy }; knob.style.transform = `translate(${dx * R * 0.6}px,${dy * R * 0.6}px)`;
  };
  joy.addEventListener('pointerdown', (e) => { jid = e.pointerId; joy.setPointerCapture(jid); setJ(e); e.preventDefault(); });
  joy.addEventListener('pointermove', (e) => { if (e.pointerId === jid) setJ(e); });
  const up = (e) => { if (e.pointerId === jid) { jid = null; C.joy = null; knob.style.transform = ''; } };
  joy.addEventListener('pointerup', up); joy.addEventListener('pointercancel', up);
  const bb = $('#bigBtn');
  bb.addEventListener('pointerdown', (e) => { e.preventDefault(); pressBtn(); });
  addEventListener('keydown', (e) => {
    if ($('#play').classList.contains('hidden')) return;
    C.keys[e.key.toLowerCase()] = true;
    if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); if (C.S && C.S.ph === 'cheer') hitDrum(); else pressBtn(); }
  });
  addEventListener('keyup', (e) => { C.keys[e.key.toLowerCase()] = false; });
  addEventListener('resize', resizeCv);
}
function pressBtn() {
  if (!C.M || !C.S) return;
  if (C.M.beat) {
    if (C.beatPs) return;
    const now = performance.now() / 1000, ph = ((now - C.beatBase) / C.beatPer) % 1, off = Math.min(ph, 1 - ph) * C.beatPer;
    if (off < 0.2) { C.inp.g++; C.flash = { t: '좋아요!', at: now, good: true }; } else { C.inp.m++; C.flash = { t: '둥! 에 맞춰요', at: now }; }
  }
  C.inp.b++; sendInput(true);
  const bb = $('#bigBtn'); bb.style.transform = 'translateY(3px)'; setTimeout(() => bb.style.transform = '', 90);
}
function hitDrum() { C.inp.d++; C.myDrum++; sendInput(true); }
function sendInput(force) {
  if (!C.net || C.pid == null) return;
  let jx = 0, jy = 0;
  if (C.joy) { jx = C.joy.x; jy = C.joy.y; }
  const k = C.keys; if (k['a'] || k['arrowleft']) jx = -1; if (k['d'] || k['arrowright']) jx = 1; if (k['w'] || k['arrowup']) jy = -1; if (k['s'] || k['arrowdown']) jy = 1;
  C.inp.jx = Math.round(jx * 100) / 100; C.inp.jy = Math.round(jy * 100) / 100;
  const key = `${C.inp.jx},${C.inp.jy},${C.inp.b},${C.inp.d},${C.inp.g},${C.inp.m}`, now = performance.now();
  if (force === true || key !== C.lastSentKey || now - C.lastSend > 500) { C.lastSentKey = key; C.lastSend = now; C.net.send(Object.assign({ t: 'I' }, C.inp)); }
}
